<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notico — Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8f0df;
        color: #123d83;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .box { max-width: 420px; border: 1px solid rgba(18,61,131,.18); border-radius: 28px; background: rgba(255,249,237,.75); padding: 32px; box-shadow: 0 24px 80px rgba(18,61,131,.12); }
      .icon { width: 64px; height: 64px; border-radius: 20px; background: #ff6bb0; color: white; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; font-size: 28px; font-weight: 900; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-size: 42px; line-height: .95; font-weight: 900; margin-bottom: 12px; color: #071b3d; }
      p { font-size: 15px; color: rgba(18,61,131,.65); line-height: 1.45; margin-bottom: 22px; font-weight: 650; }
      button {
        background: #123d83;
        color: white;
        border: none;
        border-radius: 999px;
        padding: 12px 28px;
        font-size: 14px;
        font-weight: 900;
        cursor: pointer;
      }
      button:hover { background: #071b3d; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="icon">N</div>
      <h1>You are offline.</h1>
      <p>Keep Notico open. New notes and edits made in the app are saved on this device and sync when your connection comes back.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
