<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notico</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fafafa;
        color: #1d1d1f;
        font-size: 14px;
      }
      .container { padding: 12px; display: flex; flex-direction: column; height: 100vh; }
      h1 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
      .kb-hint {
        font-size: 10px;
        color: #86868b;
        margin-bottom: 8px;
        text-align: center;
      }
      textarea {
        width: 100%;
        min-height: 120px;
        border: 1px solid #e5e5ea;
        border-radius: 8px;
        padding: 8px;
        font-size: 13px;
        font-family: "SF Mono", "Fira Code", monospace;
        resize: vertical;
        outline: none;
      }
      textarea:focus { border-color: #8B5CF6; }
      .btn {
        margin-top: 8px;
        background: #8B5CF6;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        width: 100%;
      }
      .btn:hover { background: #7C3AED; }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .btn-secondary {
        margin-top: 8px;
        background: transparent;
        color: #8B5CF6;
        border: 1px solid #e5e5ea;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 11px;
        cursor: pointer;
        width: 100%;
      }
      .btn-danger {
        margin-top: 8px;
        background: transparent;
        color: #ef4444;
        border: 1px solid #fecaca;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 11px;
        cursor: pointer;
        width: 100%;
      }
      .btn-danger:hover { background: #fef2f2; }
      .note-list { margin-top: 12px; flex: 1; overflow-y: auto; }
      .note-item {
        padding: 8px;
        border: 1px solid #e5e5ea;
        border-radius: 8px;
        margin-bottom: 6px;
        background: white;
      }
      .note-item h3 { font-size: 13px; font-weight: 500; }
      .note-item p { font-size: 11px; color: #86868b; margin-top: 2px; }
      .tag {
        display: inline-block;
        font-size: 10px;
        background: #EDE9FE;
        color: #8B5CF6;
        padding: 1px 6px;
        border-radius: 4px;
        margin-top: 4px;
        margin-right: 2px;
      }
      .status { font-size: 11px; color: #86868b; margin-top: 6px; }
      .status.error { color: #ef4444; }
      .config { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e5e5ea; }
      .config input {
        width: 100%;
        border: 1px solid #e5e5ea;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 11px;
        outline: none;
        margin-top: 4px;
      }
      .config input:focus { border-color: #8B5CF6; }
      .config label { font-size: 11px; font-weight: 500; color: #86868b; }
      .pair-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 16px; text-align: center; }
      .pair-icon { width: 48px; height: 48px; border-radius: 12px; background: #8B5CF6; display: flex; align-items: center; justify-content: center; }
      .pair-icon svg { width: 24px; height: 24px; color: white; }
      .pair-wrap h2 { font-size: 16px; font-weight: 600; }
      .pair-wrap p { font-size: 12px; color: #86868b; max-width: 240px; line-height: 1.4; }
      .pair-input {
        width: 200px;
        text-align: center;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.2em;
        font-family: "SF Mono", "Fira Code", monospace;
        border: 2px solid #e5e5ea;
        border-radius: 10px;
        padding: 10px;
        outline: none;
        text-transform: uppercase;
      }
      .pair-input:focus { border-color: #8B5CF6; }
      .paired-bar {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 12px; background: #f0fdf4; border: 1px solid #bbf7d0;
        border-radius: 8px; margin-bottom: 8px;
      }
      .paired-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
      .paired-bar span { font-size: 12px; color: #166534; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="pair-screen" class="container" style="display: none;">
      <div class="pair-wrap">
        <div class="pair-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
        <h2>Pair Extension</h2>
        <p>Generate a pairing code from the Notico website (Profile page) and paste it below.</p>
        <input id="pair-code-input" class="pair-input" type="text" maxlength="6" placeholder="XXXXXX" autocomplete="off" />
        <button class="btn" id="pair-btn" style="width: 200px;">Pair</button>
        <div class="status error" id="pair-status"></div>
      </div>
    </div>

    <div id="main-screen" class="container" style="display: none;">
      <h1>Notico</h1>
      <div class="kb-hint">Paste anything. Saves for 10 min. Cmd+Enter to save.</div>
      <div class="paired-bar">
        <span class="dot"></span>
        <span>Paired</span>
      </div>
      <textarea id="note-input" placeholder="Paste or type something..."></textarea>
      <button class="btn" id="save-btn">Save Note</button>
      <div class="status" id="save-status"></div>
      <div class="note-list" id="note-list"></div>
      <button class="btn-danger" id="unpair-btn">Unpair Extension</button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
